<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>패턴 · Ohouse Brand Book</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="../shared/shell.css">
</head>
<body>
  <main data-page="pattern" data-depth="1">
    <div class="shell-content">
      <div class="about-hero">
        <h1>패턴</h1>
        <p class="about-lead">반복되는 단위로 만들어진 시각 요소.</p>
      </div>
      <figure class="about-banner"></figure>

      <h2>사용 가이드</h2>
      <p>패턴의 적용 단위와 빈도에 대한 원칙입니다.</p>

      <h3>적용 단위</h3>
      <p>최소 단위와 반복 간격을 정의합니다.</p>
      <figure class="about-banner"></figure>

      <h2>사용 사례</h2>
      <p>실제 작업물에서 패턴이 어떻게 적용됐는지 모음입니다.</p>

      <h3>배경 활용</h3>
      <p>화면 배경에서의 패턴 활용 예시.</p>
      <figure class="about-banner"></figure>

      <h2>리소스 사용하기</h2>
      <p>패턴 SVG·PNG 등 공식 리소스를 받아갈 수 있습니다.</p>

      <h3>파일 다운로드</h3>
      <p>원본 SVG와 사용 환경별 PNG 패키지를 제공합니다.</p>
      <figure class="about-banner"></figure>
    </div>
  </main>
  <script type="module" src="../shared/shell.js"></script>
</body>
</html>
