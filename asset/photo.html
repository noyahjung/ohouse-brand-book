<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포토 · Ohouse Brand Book</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="../shared/shell.css">
</head>
<body>
  <main data-page="photo" data-depth="1">
    <div class="shell-content">
      <div class="about-hero">
        <h1>포토</h1>
        <p class="about-lead">일상의 작은 풍경을 가장 진정성 있게 옮기는 사진의 결.</p>
      </div>
      <figure class="about-banner"></figure>

      <h2>사용 가이드</h2>
      <p>사진의 톤·구도·연출에 대한 원칙입니다.</p>

      <h3>톤</h3>
      <p>자연광과 일상의 결을 살리는 톤을 우선합니다.</p>
      <figure class="about-banner"></figure>

      <h3>구도</h3>
      <p>풍경의 중심에 사람의 일상이 자리하도록 구성합니다.</p>
      <figure class="about-banner"></figure>

      <h2>사용 사례</h2>
      <p>실제 작업물에서 사진이 어떻게 운용됐는지 모음입니다.</p>

      <h3>콘텐츠</h3>
      <p>매거진·기획전 등에서의 적용 예시.</p>
      <figure class="about-banner"></figure>

      <h2>리소스 사용하기</h2>
      <p>공식 사진 라이브러리와 사용 라이선스를 안내합니다.</p>

      <h3>라이브러리</h3>
      <p>큐레이션된 사진 자산 모음을 받아갈 수 있습니다.</p>
      <figure class="about-banner"></figure>
    </div>
  </main>
  <script type="module" src="../shared/shell.js"></script>
</body>
</html>
