<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>톤 오브 보이스 · Ohouse Brand Book</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="../shared/shell.css">
</head>
<body>
  <main data-page="voice" data-depth="1">
    <div class="shell-content">
      <div class="about-hero">
        <h1>톤 오브 보이스</h1>
        <p class="about-lead">오늘의집이 말과 글로 사람들에게 닿는 방식.</p>
      </div>
      <figure class="about-banner">
        <img src="../assets/overview_asset/text.webp" alt="">
      </figure>

      <h2>사용 가이드</h2>
      <p>오늘의집의 목소리는 일상의 결을 닮습니다. 한 톤으로 일관되게 들리도록 원칙을 따라 주세요.</p>

      <h3>원칙</h3>
      <p>친근하되 가볍지 않고, 명료하되 차갑지 않게.</p>
      <figure class="about-banner"></figure>

      <h3>금기</h3>
      <p>피해야 할 표현과 어조의 가이드.</p>
      <figure class="about-banner"></figure>

      <h2>사용 사례</h2>
      <p>실제 작업물에서 톤이 어떻게 운용됐는지 모음입니다.</p>

      <h3>마이크로카피</h3>
      <p>버튼·알림 등 작은 단위 카피의 적용 예시.</p>
      <figure class="about-banner"></figure>

      <h2>리소스 사용하기</h2>
      <p>카피 라이팅 가이드 문서와 체크리스트를 제공합니다.</p>

      <h3>가이드 문서</h3>
      <p>실무에서 바로 참조할 수 있는 라이팅 가이드.</p>
      <figure class="about-banner"></figure>
    </div>
  </main>
  <script type="module" src="../shared/shell.js"></script>
</body>
</html>
